[build]
  publish = "public"

[build.environment]
  GO_VERSION = "1.23"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/v1/*"
  to = "/.netlify/functions/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/healthz"
  to = "/.netlify/functions/api/healthz"
  status = 200
  force = true
